    <style>
        
        :root {
            --window-bg: #f2f2f2;
            --title-bar: #d6d6d6;
            --border-dark: #444;
            --mac-case: #e2e2d0;
            --mac-screen: #3a3a3a;
            --mac-accent: #b5b5a0;
        }
        a:link {
            color: rgb(12, 12, 12);
        }

            /* visited link */
        /* a:visited {
            color: green;
        } */

            /* mouse over link */
        a:hover {
            color: rgb(0, 0, 255);
        }

            /* selected link */
        /* a:active {
            color: blue;
        } */

    
        li[onclick] {
            cursor: pointer;
            transition: color 0.2s;
        }

        li[onclick]:hover {
            color: rgb(0, 0, 25); /* Same pink you use for links */
            text-decoration: underline;
        }
        span[onclick]:hover {
            color: rgb(0, 0, 25); /* Same pink you use for links */
            text-decoration: underline;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #030303;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }

        /* --- Landing Page Styling --- */
        #landing {
            text-align: center;
            cursor: pointer;
            transition: transform 0.6s ease-in-out, opacity 0.5s;
            z-index: 100;
        }
        #landing {
            position: relative;
            width: 90vw;        /* Scales with browser width */
            max-width: 1000px;  /* Limits max size */
            aspect-ratio: 4 / 3; /* Matches the proportions of a CRT monitor */
            margin: auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .computer {
            position: relative;
            width: 1000px; /* Slightly wider for the TV look */
            height: 600px;
            background: #0b0b0b; /* Darker plastic frame */
            border-radius: 40px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            box-shadow: inset -10px -10px 15px #3c3c3c, 15px 15px 30px #3c3c3c(0,0,0,0.5);
        }

        .screen-border {
            width: 100%;
            height: 100%;
            background: #1a1a1a;
            border-radius: 30px;
            padding: 15px;
            box-shadow: inset 0 0 20px #000;
            display: flex;
        }
        .monitor-frame {
            position: absolute;
            /* top: 0;
            left: 0; */
            width: 120%;
            height: 120%;
            background-image: url('holelp.png'); 
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center; /* THIS centers the monitor image */
            z-index: 2; 
            pointer-events: none; 
        }

        .screen {
            position: absolute; /* Changed from relative so it can be moved freely */
            
            /* ADJUST THESE 4 VALUES to perfectly line up with your specific PNG hole */
            top: -4%;
            left: 16%;
            width: 65%;
            height: 70%;
            
            background-color: #463e3e;
            background-image: url('darklilieshome.png'); 
            background-size: cover;
            background-position: center; /* Fixed the invalid 'absolute' typo */
            z-index: 1;
                    
            border-radius: 25px; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            
            color: #fffffd;
            text-shadow: 2px 2px 0px #398852, 0 0 10px rgba(129, 252, 7, 0.986);
            overflow: hidden;
        }
        

        .screen::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(216, 0, 0, 0.043) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
        }
        .floppy-slot {
            position: absolute; bottom: 40px; right: 25px;
            width: 60px; height: 4px; background: #555;
        }

        .base {
            position: absolute; bottom: -10px; left: -10%;
            width: 120%; height: 20px; background: var(--mac-accent);
            border-radius: 5px;
        }

        .click-text { color: #ffffff; letter-spacing: 2px; animation: blink 1.5s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* --- Global Page Container --- */
        .page-content {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #b6d5f6; /* A classic desktop blue-grey */
            display: none; /* Hidden by default */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            background-image: url('lilyhomelight.png');
            background-repeat: no-repeat;
            background-size: cover;

            /* Center the image */
            background-position: left;

            /* Keep it fixed so it doesn't scroll with content */
            background-attachment: fixed;
            transition: opacity 0.5s ease-in;
        }

        .active-page { display: flex !important; opacity: 1 !important; }

        /* --- Retro Window Styling --- */
        .window {
            width: max-content;
            min-width: 550px;
            max-width: 70%;
            height: auto;
            background: var(--window-bg);
            border: 2px solid var(--border-dark);
            box-shadow: 6px 6px 0px rgba(0,0,0,0.3);
        }

        .title-bar {
            background: var(--title-bar);
            border-bottom: 2px solid var(--border-dark);
            padding: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, #bbb 2px, #bbb 4px);
        }
        .inline-list {
            display: flex;       /* Lays children out in a row */
            list-style: none;    /* Removes the bullet points */
            padding: 0;
            gap: 20px;           /* Sets the distance between the two items */
        }
        .title-text { background: var(--title-bar); padding: 0 10px; font-weight: bold; font-size: 14px; }
        .close-btn { display: flex;
                    justify-content: center;
                    align-items: center;
                    font-size: 15px;
                    font-family: 'Chicago', sans-serif;
                    font-weight: bold;
                    line-height: 1;
                    text-decoration: none;
                    color: black;
                    width: 14px; height: 14px; border: 2px solid var(--border-dark); background: white; cursor: pointer; margin-left: 5px;
                }
        .back-btn { display: flex;
                    justify-content: center;
                    align-items: center;
                    font-size: 15px;
                    font-family: 'Chicago', sans-serif;
                    font-weight: bold;
                    line-height: 1;
                    text-decoration: none;
                    color: black;
                    width: 18px; height: 14px; border: 2px solid var(--border-dark); background: white; cursor: pointer; margin-left: 5px;
                }
        
        .nav-menu { background: #eee; border-bottom: 1px solid #ccc; padding: 10px; display: flex; gap: 10px; }
        .nav-menu button { 
            font-family: 'Chicago', sans-serif; 
            cursor: pointer; 
            border: 1px solid #444; 
            background: white; 
            padding: 2px 10px;
        }
        .nav-menu button:active { background: #444; color: white; }
        .gif-container {
            display: flex;
            justify-content: center; /* Horizontal centering */
            align-items: center;     /* Vertical centering */
            min-height: 200px; 
            padding: 20px;          /* Optional: center in the full viewport height */
        }

        .window-content { padding: 20px; min-height: 200px; }
        .hidden { display: none !important; }
    </style>
</head>

    <script>
        // FUNCTION 1: The Initial Boot
        // Add a 'silent' parameter with a default of 'false'
function showSection(sectionId, silent = false) {
    const allPages = document.querySelectorAll('.page-content');
    allPages.forEach(page => {
        page.classList.remove('active-page');
    });

    // Only play if NOT silent
    if (!silent) {
        const sound = document.getElementById('click-sound');
        const soundClone = sound.cloneNode();
        soundClone.play().catch(e => console.log("Sound blocked"));
    }

    const target = document.getElementById(sectionId);
    target.classList.add('active-page');
}
function click_for_others(){
    const sound = document.getElementById('click-sound');
    sound.play().catch(e => console.log("Sound blocked"));
  }
function openPortfolio() {
    const sound = document.getElementById('startup-sound');
    sound.play().catch(e => console.log("Sound blocked"));

    const landing = document.getElementById('landing');
    landing.style.opacity = '0';
    landing.style.transform = 'scale(3)';
    
    setTimeout(() => {
        landing.classList.add('hidden');
        // Pass 'true' here to make the transition silent!
        showSection('about-page', true); 
    }, 600);
}
    </script>
